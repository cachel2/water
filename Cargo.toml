[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Axel Ibarrondo"]
license = "GPL-3.0-or-later"
repository = "https://github.com/cachel2/water"

[workspace.dependencies]
water_diag = { path = "crates/water_diag" }
water_lex = { path = "crates/water_lex" }
water_parse = { path = "crates/water_parse" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
